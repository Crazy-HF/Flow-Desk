spring:
  main:
    banner-mode: "off"
  task:
    scheduling:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flowdesk:
  attachment-root: ${java.io.tmpdir}/flowdesk-test-attachments

jwt:
  secret: dGVzdC1vbmx5LXNlY3JldC10aGF0LWlzLW5vdC1mb3ItcHJvZA==
  expiration: 15m
  issuer: https://flowdesk.test

auth:
  refresh-expiration: 7d
  refresh-cookie-name: FLOWDESK_REFRESH
  refresh-cookie-path: /fd/v1/auth
  cookie-secure: false
  refresh-token-bytes: 32
  allowed-origins: http://localhost
