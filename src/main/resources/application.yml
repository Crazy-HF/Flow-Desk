spring:
  application:
    name: flowdesk
  profiles:
    group:
      # 本地数据库已应用 demo 种子（R__seed_demo_data.sql）；Flyway 校验要求
      # 每次启动都扫描到同一批迁移位置，因此 local 固定包含 demo。
      local: demo
  datasource:
    url: ${FLOWDESK_DB_URL}
    username: ${FLOWDESK_DB_USERNAME}
    password: ${FLOWDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${FLOWDESK_REDIS_HOST}
      port: ${FLOWDESK_REDIS_PORT}
      password:
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 附件外层闸（Boot 的 MB 即 MiB）：应用层 AttachmentValidator 才是权威口径，这里只是提前拒绝超大请求。
      # 必须 ≥ flowdesk.attachment.max-file-size / max-request-total-size，否则调高应用层限额也不会生效。
      # 默认值对应 7.1 的「单文件 ≤ 10 MiB、单次 ≤ 5 个且总计 ≤ 25 MiB」（外层留出 multipart 边界开销）。
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flowdesk:
  attachment:
    # 附件本地暂存根目录：必须位于 Web 根目录之外、使用绝对路径、可写且持久化（docs/engineering-readiness.md 第 5 节）。
    # 两种驱动都用它承载暂存；local 驱动在 root 下再建 files/ 最终目录（两者必须同卷，启动时校验），
    # s3 驱动的最终存储在对象存储里，root 下只保留 staging/。子目录不单独配置。
    root: ${FLOWDESK_ATTACHMENT_ROOT}
    # 暂存文件与「上传后未绑定」附件的保留期；对账任务清理与工单侧引用校验共用同一口径
    # （docs/api-design.md 7.1 默认 24 小时）。缺失时取默认值 24h。
    retention: 24h
    # 存储驱动：local（开发/测试，本地受控目录）| s3（生产，任意 S3 兼容对象存储：MinIO / 阿里云 OSS）。
    # 两种驱动都做启动自检，配置错误在启动阶段暴露；缺配置时取 local，因此测试与 CI 不依赖对象存储。
    storage: ${FLOWDESK_ATTACHMENT_STORAGE:local}
    # 限额（docs/api-design.md 7.1/7.6 的默认值）：可配置，改配置即可生效，不再改代码。
    # 注意 spring.servlet.multipart.* 是外层闸且为静态配置，调高这里必须同步调高外层闸，否则请求进不了应用层。
    max-file-size: 10MB
    max-files-per-request: 5
    max-request-total-size: 25MB
    max-original-name-length: 255
    # 孤儿对账任务开关（每小时整点）；测试与本地调试可置 false。
    reconciliation-enabled: true
    # S3 兼容对象存储（storage=s3 时必填 bucket / access-key / secret-key；建议用环境变量注入，不写入仓库）。
    # endpoint 留空表示使用官方 AWS S3；MinIO 与 OSS 必须给出。path-style 默认开启（MinIO 必须）。
    s3:
      endpoint: ${FLOWDESK_ATTACHMENT_S3_ENDPOINT:}
      bucket: ${FLOWDESK_ATTACHMENT_S3_BUCKET:}
      region: ${FLOWDESK_ATTACHMENT_S3_REGION:us-east-1}
      access-key: ${FLOWDESK_ATTACHMENT_S3_ACCESS_KEY:}
      secret-key: ${FLOWDESK_ATTACHMENT_S3_SECRET_KEY:}
      path-style: true
  ticket:
    # 员工确认期限：IT 提交解决结果后 7×24 小时（docs/kickoff.md 已确认规则）。
    confirmation-window: 7d
    # 员工补充期限：IT 请求补充后 7×24 小时（docs/kickoff.md 4.12 已确认规则）。
    # 本版本只写入并在界面展示，到期不会自动关闭工单（用户 2026-10-06 裁决）。
    supplement-window: 7d
    # 撤销请求的响应期限：提交人发起后 IT 需在 3×24 小时内批准或拒绝（docs/kickoff.md 4.7）。
    # 与上面两个期限同口径：只写入并在界面展示，到期不会自动改变工单状态。
    cancel-request-window: 3d
  notification:
    # 已读通知的保留期：清理任务删除 read_at 早于该阈值的通知，未读通知永不清理。
    # 缺失时取默认值 90d。
    retention: 90d

jwt:
  secret: ${FLOWDESK_JWT_SECRET}
  expiration: 15m
  issuer: https://flowdesk.local

auth:
  refresh-expiration: 7d
  refresh-cookie-name: FLOWDESK_REFRESH
  refresh-cookie-path: /fd/v1/auth
  cookie-secure: ${FLOWDESK_COOKIE_SECURE}
  refresh-token-bytes: 32
  allowed-origins: ${FLOWDESK_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
