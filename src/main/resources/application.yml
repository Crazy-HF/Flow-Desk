spring:
  application:
    name: flowdesk
  profiles:
    group:
      # 本地数据库已应用 demo 种子（R__seed_demo_data.sql）；Flyway 校验要求
      # 每次启动都扫描到同一批迁移位置，因此 local 固定包含 demo。
      local: demo
  datasource:
    url: ${FLOWDESK_DB_URL}
    username: ${FLOWDESK_DB_USERNAME}
    password: ${FLOWDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${FLOWDESK_REDIS_HOST}
      port: ${FLOWDESK_REDIS_PORT}
      password:
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 附件契约（docs/api-design.md 7.1）：单文件 ≤ 10 MiB、单次 ≤ 5 个且总计 ≤ 25 MiB。
      # 这一层是外层闸（Boot 的 MB 即 MiB）；应用层 AttachmentValidator 仍是权威口径。
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flowdesk:
  attachment:
    # 附件受控目录：必须位于 Web 根目录之外、使用绝对路径、可写且持久化（docs/engineering-readiness.md 第 5 节）。
    # staging/ 与 files/ 子目录由存储组件启动时校验并自动创建。
    root: ${FLOWDESK_ATTACHMENT_ROOT}
    # 暂存文件与「上传后未绑定」附件的保留期；对账任务清理与工单侧引用校验共用同一口径
    # （docs/api-design.md 7.1 默认 24 小时）。缺失时取默认值 24h。
    retention: 24h
  ticket:
    # 员工确认期限：IT 提交解决结果后 7×24 小时（docs/kickoff.md 已确认规则）。
    confirmation-window: 7d
    # 员工补充期限：IT 请求补充后 7×24 小时（docs/kickoff.md 4.12 已确认规则）。
    # 本版本只写入并在界面展示，到期不会自动关闭工单（用户 2026-10-06 裁决）。
    supplement-window: 7d
    # 撤销请求的响应期限：提交人发起后 IT 需在 3×24 小时内批准或拒绝（docs/kickoff.md 4.7）。
    # 与上面两个期限同口径：只写入并在界面展示，到期不会自动改变工单状态。
    cancel-request-window: 3d

jwt:
  secret: ${FLOWDESK_JWT_SECRET}
  expiration: 15m
  issuer: https://flowdesk.local

auth:
  refresh-expiration: 7d
  refresh-cookie-name: FLOWDESK_REFRESH
  refresh-cookie-path: /fd/v1/auth
  cookie-secure: ${FLOWDESK_COOKIE_SECURE}
  refresh-token-bytes: 32
  allowed-origins: ${FLOWDESK_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
