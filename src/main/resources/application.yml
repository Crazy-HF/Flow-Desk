spring:
  application:
    name: flowdesk
  profiles:
    group:
      # 本地数据库已应用 demo 种子（R__seed_demo_data.sql）；Flyway 校验要求
      # 每次启动都扫描到同一批迁移位置，因此 local 固定包含 demo。
      local: demo
  datasource:
    url: ${FLOWDESK_DB_URL}
    username: ${FLOWDESK_DB_USERNAME}
    password: ${FLOWDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${FLOWDESK_REDIS_HOST}
      port: ${FLOWDESK_REDIS_PORT}
      password:
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flowdesk:
  attachment-root: ${FLOWDESK_ATTACHMENT_ROOT}
  ticket:
    # 员工确认期限：IT 提交解决结果后 7×24 小时（docs/kickoff.md 已确认规则）。
    confirmation-window: 7d
    # 员工补充期限：IT 请求补充后 7×24 小时（docs/kickoff.md 4.12 已确认规则）。
    # 本版本只写入并在界面展示，到期不会自动关闭工单（用户 2026-10-06 裁决）。
    supplement-window: 7d

jwt:
  secret: ${FLOWDESK_JWT_SECRET}
  expiration: 15m
  issuer: https://flowdesk.local

auth:
  refresh-expiration: 7d
  refresh-cookie-name: FLOWDESK_REFRESH
  refresh-cookie-path: /fd/v1/auth
  cookie-secure: ${FLOWDESK_COOKIE_SECURE}
  refresh-token-bytes: 32
  allowed-origins: ${FLOWDESK_ALLOWED_ORIGINS}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
