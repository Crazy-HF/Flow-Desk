spring:
  application:
    name: flowdesk
  datasource:
    url: ${FLOWDESK_DB_URL}
    username: ${FLOWDESK_DB_USERNAME}
    password: ${FLOWDESK_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 5000
      validation-timeout: 3000
  data:
    redis:
      host: ${FLOWDESK_REDIS_HOST}
      port: ${FLOWDESK_REDIS_PORT}
      password:
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: false

server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

flowdesk:
  allowed-origins: ${FLOWDESK_ALLOWED_ORIGINS}
  attachment-root: ${FLOWDESK_ATTACHMENT_ROOT}
  cookie-secure: ${FLOWDESK_COOKIE_SECURE}

jwt:
  secret: ${FLOWDESK_JWT_SECRET}
  expiration: 900
  issuer: https://flowdesk.local

auth:
  refresh-expiration: 7d
  refresh-cookie-name: FLOWDESK_REFRESH
  refresh-cookie-path: /fd/v1/auth
  cookie-secure: ${FLOWDESK_COOKIE_SECURE}
  refresh-token-bytes: 32

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
