name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode verify
      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
          if-no-files-found: ignore

  frontend-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install and verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test:unit --run
          pnpm build

  core-e2e:
    needs: [backend-verify, frontend-verify]
    runs-on: ubuntu-24.04
    env:
      FLOWDESK_MYSQL_ROOT_PASSWORD: ci-only-root-password
      FLOWDESK_DB_URL: jdbc:mysql://localhost:3306/flowdesk?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
      FLOWDESK_DB_USERNAME: flowdesk
      FLOWDESK_DB_PASSWORD: ci-only-db-password
      FLOWDESK_REDIS_HOST: localhost
      FLOWDESK_REDIS_PORT: '6379'
      FLOWDESK_REDIS_PASSWORD: ''
      FLOWDESK_ALLOWED_ORIGINS: http://127.0.0.1:4173
      FLOWDESK_ATTACHMENT_ROOT: ${{ github.workspace }}/.flowdesk/attachments
      FLOWDESK_COOKIE_SECURE: 'false'
      FLOWDESK_JWT_SECRET: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLXNlY3JldC0zMi1ieXRlcw==
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start dependencies and backend with demo fixtures
        run: |
          chmod +x mvnw
          docker compose up --detach --wait
          ./mvnw --batch-mode spring-boot:run -Dspring-boot.run.profiles=demo > backend.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/actuator/health && exit 0
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Run core browser smoke test
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm build
          pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
          if-no-files-found: ignore
      - name: Stop CI dependencies
        if: always()
        run: docker compose down --volumes --remove-orphans
